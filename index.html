<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cuenta regresiva</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background: #000;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

.contenedor {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
}

.grupo {
    text-align: center;
}

.numeros {
    display: flex;
    gap: 3px;
}

.digito {
    width: 55px;
    height: 75px;

    background: linear-gradient(
        to bottom,
        #182329,
        #050708
    );

    border: 2px solid #202c31;

    border-radius: 5px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 55px;
    font-weight: bold;

    color: #eeeeee;

    text-shadow:
        2px 2px 3px #000;

    box-shadow:
        inset 0 0 8px #000,
        0 3px 5px #000;
}

.etiqueta {
    margin-top: 10px;
    font-size: 13px;
    color: #aaa;
    text-transform: uppercase;
}

.separador {
    font-size: 45px;
    color: #888;
    margin-top: -25px;
}

#mensaje {
    display: none;
    color: white;
    font-size: 32px;
    text-align: center;
    font-weight: bold;
}

@media (max-width: 600px) {

    .contenedor {
        gap: 5px;
    }

    .digito {
        width: 32px;
        height: 48px;
        font-size: 35px;
    }

    .separador {
        font-size: 25px;
    }

    .etiqueta {
        font-size: 8px;
    }
}

</style>
</head>

<body>

<div class="contenedor" id="contador">

    <div class="grupo">
        <div class="numeros" id="dias"></div>
        <div class="etiqueta">Días</div>
    </div>

    <div class="separador">:</div>

    <div class="grupo">
        <div class="numeros" id="horas"></div>
        <div class="etiqueta">Horas</div>
    </div>

    <div class="separador">:</div>

    <div class="grupo">
        <div class="numeros" id="minutos"></div>
        <div class="etiqueta">Min</div>
    </div>

    <div class="separador">:</div>

    <div class="grupo">
        <div class="numeros" id="segundos"></div>
        <div class="etiqueta">Seg</div>
    </div>

</div>


<div id="mensaje">
    Alma, ¿querés ser mi novia?
</div>


<script>

const fechaObjetivo =
    new Date("2026-11-23T00:00:00-03:00");


function ponerNumero(elemento, numero) {

    numero = String(numero).padStart(2, "0");

    elemento.innerHTML = "";

    for (let digito of numero) {

        const caja = document.createElement("div");

        caja.className = "digito";

        caja.textContent = digito;

        elemento.appendChild(caja);
    }
}


function actualizar() {

    const ahora = new Date();

    const diferencia =
        fechaObjetivo - ahora;


    if (diferencia <= 0) {

        document.getElementById("contador")
            .style.display = "none";

        document.getElementById("mensaje")
            .style.display = "block";

        return;
    }


    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia / (1000 * 60 * 60)) % 24
    );

    const minutos = Math.floor(
        (diferencia / (1000 * 60)) % 60
    );

    const segundos = Math.floor(
        (diferencia / 1000) % 60
    );


    ponerNumero(
        document.getElementById("dias"),
        dias
    );

    ponerNumero(
        document.getElementById("horas"),
        horas
    );

    ponerNumero(
        document.getElementById("minutos"),
        minutos
    );

    ponerNumero(
        document.getElementById("segundos"),
        segundos
    );
}


actualizar();

setInterval(actualizar, 1000);

</script>

</body>
</html>
